services:
  pocketbase:
    build: ./pb
    container_name: multilooper-pocketbase
    ports:
      - "8090:8090"
    volumes:
      - ./pb/pb_data:/pb_data
      - ./pb/pb_migrations:/pb_migrations
      # default hooksDir resolves relative to the data dir (/pb_data/../pb_hooks)
      - ./pb/pb_hooks:/pb_hooks
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    restart: unless-stopped
